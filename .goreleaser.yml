# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
# See: https://goreleaser.com/customization/
version: 2

builds:
  - id: docker-credential-jfrog
    main: ./cmd/docker
    binary: docker-credential-jfrog
    ldflags:
    - -X github.com/docker/docker-credential-helpers/credentials.Name=docker-credential-jfrog
    - -X github.com/docker/docker-credential-helpers/credentials.Package=github.com/psigen/jfrog-credential-helpers
    - -X github.com/docker/docker-credential-helpers/credentials.Version={{.Version}}

  - id: bazel-credential-jfrog
    main: ./cmd/bazel
    binary: bazel-credential-jfrog

archives:
  - id: docker-credential-jfrog
    builds: ["docker-credential-jfrog"]
    formats: ["binary"]

  - id: bazel-credential-jfrog
    builds: ["bazel-credential-jfrog"]
    formats: ["binary"]
